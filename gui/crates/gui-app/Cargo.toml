[package]
name = "gui-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "BelieveBoy GUI 应用入口（GPUI 视图、状态、main）"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "believeboy-gui"
path = "src/main.rs"

[dependencies]
gui-domain = { workspace = true }
gui-api-client = { workspace = true }

gpui = { workspace = true }
gpui-component = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
keyring = { workspace = true }
dotenvy = { workspace = true }
unicode-segmentation = "1.12"
# BLF-749：Markdown 转换导出 Word——docx 生成（纯 Rust OOXML writer）。
# default-features = false 去掉 image feature（本视图不嵌入图片，web 端图片也只
# 渲染 `[图片：alt]` 占位文本）；zip/xml 为其传递依赖。
docx-rs = { version = "0.4", default-features = false }
# BLF-749：打开 .md / 导出 docx 的原生文件对话框（macOS NSOpenPanel/NSSavePanel）。
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
# 读取系统「减弱动态效果」（prefers-reduced-motion）：gpui 0.2.2 无 reduce-motion API，
# 用 AppKit NSWorkspace 读取。objc2-app-kit 0.3.2 已在锁文件（blade-graphics → gpui 的
# 传递依赖），此处仅改为直接依赖并开 NSWorkspace feature——不引入新 crate。
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }

[dev-dependencies]
# 视图级单元测试需要 TestAppContext / gpui::test（dashboard.rs 竞态保护测试）
gpui = { workspace = true, features = ["test-support"] }
# BLF-712：logo.svg 渲染契约测试——用 gpui 同款 SVG 渲染器（resvg/usvg，已在锁文件
# 作为 gpui 依赖）离屏验证应用图标几何（不引入新 crate 下载）。
resvg = "0.45"
