name: release-macos

# BelieveBoy GUI — macOS release 打包（可选，BLF-682 GUI-10）
#
# 触发：手动（workflow_dispatch）或打 tag `gui-v*`
# 产物：gui/dist/BelieveBoy GUI.app（+ .dmg），上传为 artifact
#
# 说明：CI 产物为 ad-hoc 签名（无 Apple Developer ID 凭据的仓库环境）。
# 正式分发签名 + 公证需在本地跑 scripts/notarize.sh（或后续接
# secrets: APPLE_SIGN_IDENTITY / APPLE_ID / APPLE_APP_PASSWORD）。

on:
  workflow_dispatch: {}
  push:
    tags:
      - "gui-v*"

permissions:
  contents: read

jobs:
  bundle:
    name: Build macOS .app + .dmg
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('gui/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release -p gui-app

      - name: Test
        run: cargo test

      - name: Bundle .app + .dmg
        run: ./scripts/bundle.sh --dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: believeboy-gui-macos
          path: |
            gui/dist/*.app
            gui/dist/*.dmg
          if-no-files-found: error
