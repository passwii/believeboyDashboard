# BelieveBoy journald 磁盘上限（BLF-1035）
#
# 背景：VPS（15G 盘）journald 无上限时曾占 921MB，触发磁盘 75% used 告警。
# 2026-09-12 巡检（BLF-1033）后先在 VPS 手工落地，本文件把它固化进仓库，
# 由 productEnvAgent/deploy_vps.py 的 DEPLOY_COMMANDS 安装到
# /etc/systemd/journald.conf.d/00-believeboy-cap.conf，保证新机器/重装不丢。
#
# 值的选择：
# - SystemMaxUse=200M —— 日志归档 + 活跃 journal 合计封顶 200MB。
#   Stage 1（BLF-1034）移除 office_tick 3s beat 后每天日志量已从 ~8.7 万行
#   骤降（原 99.3% 是 office_tick），200M 足以保留数周排障窗口。
# - SystemKeepFree=1G —— journald 收缩后至少给磁盘留 1G 空闲，避免与其他
#   写入（PG/备份/日志）争抢最后空间。
# 改值需同步改 VPS 生效验证（systemctl restart systemd-journald 后
# journalctl --disk-usage 观察）。

[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
