# pgBackRest Configuration for BelieveBoy Dashboard
# PostgreSQL Backup to Cloudflare R2

# =============================================================================
# Global Settings
# =============================================================================
[global]
# Repository (backup storage) configuration
repo1-path=/var/lib/pgbackrest/backups
repo1-type=s3
repo1-s3-bucket=believeboy-dash
repo1-s3-endpoint=https://b2ed6ca0544b57982275dedfa7ca46c.r2.cloudflarestorage.com
repo1-s3-region=auto
repo1-s3-key=<REDACTED-ROTATE-IN-CLOUDFLARE-R2>
repo1-s3-key-secret=<REDACTED-ROTATE-IN-CLOUDFLARE-R2>
repo1-s3-uri-style=host

# Retention policy
repo1-retention-full=7
repo1-retention-diff=7

# Logging
log-level-console=info
log-level-file=debug
log-path=/var/log/pgbackrest

# Performance
process-max=4
start-fast=y
compress-level=3

# =============================================================================
# Archive Push Settings (for WAL archiving)
# =============================================================================
[global:archive-push]
process-max=2
compress-level=3

# =============================================================================
# Archive Get Settings (for restore)
# =============================================================================
[global:archive-get]
process-max=2

# =============================================================================
# Stanza: blf (BeliefBoy Dashboard database)
# =============================================================================
[blf]
db-path=/var/lib/postgresql/15/main
db1-port=5432
db1-host=localhost
db1-user=postgres
db1-name=BLF