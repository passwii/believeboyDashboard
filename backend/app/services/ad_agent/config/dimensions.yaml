# ─────────────────────────────────────────────────────────────────────────────
# Ad Analysis Dimension Registry
# ─────────────────────────────────────────────────────────────────────────────
# 维度注册表：定义所有可分析维度、数据依赖、交叉分析模板。
# Strategy Planner 基于此 + DataProfiler 输出动态组装分析策略。
#
# level:
#   1 = 单维度深挖（独立分析一张报表）
#   2 = 交叉分析（需要 2+ 维度的结论才能产出）
#   3 = 深度时序交叉（需要对比期数据 / 跨周期趋势）
#
# signal_threshold:
#   minimum = 至少有数据就行
#   moderate = 数据量中等（summary 有值）
#   strong   = 数据量充足（top-N 有多行 + summary 有值）
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0.0"
last_updated: "2026-06-04"

# ── 数据源 → 报表类型映射 ─────────────────────────────────────────────────────
data_source_registry:
  ad_promoted_product_report:
    label: "商品推广 (SKU/ASIN)"
    group_by: "ad_sku"
    common_metrics: [spend, sales_7d, orders_7d, clicks, impressions]

  ad_campaign_report:
    label: "广告活动 (Campaign)"
    group_by: "campaign_name"
    common_metrics: [spend, sales_7d, orders_7d, clicks, impressions]

  ad_search_term_report:
    label: "搜索词"
    group_by: "search_term"
    common_metrics: [spend, sales_7d, orders_7d, clicks, impressions]

  ad_target_report:
    label: "投放目标 (Target)"
    group_by: "target_text"
    common_metrics: [spend, sales_7d, orders_7d, clicks, impressions]

  ad_placement_report:
    label: "广告位 (Placement)"
    group_by: "placement"
    common_metrics: [spend, sales_7d, orders_7d, clicks, impressions]

  ad_budget_report:
    label: "预算"
    group_by: "campaign_name"
    common_metrics: [spend, budget]

  ad_invalid_traffic_report:
    label: "无效流量"
    group_by: null
    common_metrics: [spend, clicks, impressions]

  ad_time_trend_report:
    label: "时间趋势"
    group_by: null
    common_metrics: [spend, sales_7d, orders_7d, clicks, impressions]

  ad_search_term_share_report:
    label: "搜索词展示量份额"
    group_by: "search_term"
    common_metrics: [impressions]

  ad_purchased_product_report:
    label: "已购买商品"
    group_by: "ad_sku"
    common_metrics: [spend, sales_7d, orders_7d, clicks, impressions]

# ── 非广告数据源 ──────────────────────────────────────────────────────────────
auxiliary_sources:
  sales_by_date:
    label: "销售日汇总"
    key_fields: [order_qty, sales_amount, unique_asins]

  inventory_summary:
    label: "库存快照"
    key_fields: [available, out_of_stock_skus, aging_summary]

  comparison_period:
    label: "对比期"
    key_fields: [total_sales, total_orders, total_ad_spend, total_ad_sales]

  top_skus:
    label: "Top SKU 排行"
    key_fields: [sku, asin, order_qty, sales_amount]

# ═════════════════════════════════════════════════════════════════════════════
# 维度定义
# ═════════════════════════════════════════════════════════════════════════════

dimensions:

  # ── Level 1: 单维度深挖 ────────────────────────────────────────────────────

  search_term_waste:
    name: "搜索词浪费识别"
    level: 1
    priority: 10
    required_sources: [ad_search_term_report]
    optional_sources: [ad_campaign_report, ad_search_term_share_report]
    description: >
      识别高花费零转化/低转化搜索词，计算浪费金额及占比。
      关注：花费 > $5 且订单 = 0 的词；ACoS > 目标值 2 倍以上的词；
      以及这些词所属的 campaign 和 ad group。
    analysis_prompt_hint: >
      逐个审视 search_term_report 的 top 行。对每个搜索词计算：
      (1) spend (2) orders_7d (3) ACoS = spend/sales (4) 浪费金额 = spend - sales。
      将结果分为三档：零转化（orders=0, 浪费=spend 全额）、低转化（ACoS > 目标 2x）、正常。
      对零转化词，标注其所属 campaign（如果 campaign_report 数据可交叉）。
    signal_threshold: moderate
    output_artifacts: [waste_summary_table, waste_by_campaign]

  budget_utilization:
    name: "预算利用率分析"
    level: 1
    priority: 9
    required_sources: [ad_budget_report]
    optional_sources: [ad_campaign_report, ad_time_trend_report]
    description: >
      对比建议预算 vs 实际预算，识别预算不足（限制了曝光）和预算过度（浪费）的 campaign。
      关注：建议预算与实际差异 > 30% 的 campaign。
    analysis_prompt_hint: >
      审视 budget_report 的 top 行。对每个 campaign：
      (1) 实际 spend (2) 建议预算 (3) 利用率 = spend / budget。
      利用率 > 90% = 预算紧张（可能限制曝光），< 50% = 预算过剩。
      结合 campaign_report 的 impressions 判断：预算紧张的 campaign 是否 impression share 下降。
    signal_threshold: moderate
    output_artifacts: [budget_utilization_table, over_under_campaigns]

  placement_efficiency:
    name: "广告位效率对比"
    level: 1
    priority: 8
    required_sources: [ad_placement_report]
    optional_sources: [ad_campaign_report]
    description: >
      对比 Top of Search / Rest of Search / Product Pages 三个广告位的 CPC、CTR、ROAS。
      找出效率最高和最低的广告位。
    analysis_prompt_hint: >
      对比 placement_report 中每个 placement 的指标：
      CPC = spend/clicks, CTR = clicks/impressions, ROAS = sales/spend。
      重点关注：Top of Search 的 CPC 是否显著高于其他位置（> 50%）；
      Product Pages 的 ROAS 是否低于 Rest of Search。
    signal_threshold: moderate
    output_artifacts: [placement_comparison_table]

  campaign_health:
    name: "Campaign 结构健康度"
    level: 1
    priority: 8
    required_sources: [ad_campaign_report]
    optional_sources: [ad_search_term_report, ad_target_report, ad_placement_report]
    description: >
      评估每个 campaign 的整体健康度：ROAS、ACoS 趋势、花费集中度。
      识别需要暂停、拆分或合并的 campaign。
    analysis_prompt_hint: >
      对 campaign_report 的 top 行逐个评估：
      (1) ROAS < 1 = 亏损 campaign (2) ACoS > 50% 且无改善趋势 (3) 花费高度集中于 1-2 campaign。
      如果有 search_term_report 数据，检查亏损 campaign 是否有大量零转化搜索词在消耗预算。
    signal_threshold: minimum
    output_artifacts: [campaign_health_scorecard]

  sku_ad_performance:
    name: "SKU/ASIN 广告表现"
    level: 1
    priority: 9
    required_sources: [ad_promoted_product_report]
    optional_sources: [inventory_summary, top_skus, sales_by_date]
    description: >
      评估每个 SKU/ASIN 的广告投入产出比。
      识别广告表现好但自然销量差的 SKU（可能过度依赖广告），
      以及自然销量好但广告投入不足的 SKU（有增长空间）。
    analysis_prompt_hint: >
      对 promoted_product_report 的 top 行：
      (1) 广告 ROAS (2) 广告订单占比 = ad_orders / (ad_orders + natural_orders 估算)。
      如果有 top_skus（自然销量）数据，计算每个 SKU 的广告依赖度。
      如果有 inventory_summary，检查广告投入大的 SKU 是否库存充足。
    signal_threshold: moderate
    output_artifacts: [sku_ad_roas_table, ad_dependency_analysis]

  target_effectiveness:
    name: "投放目标 (Target) 效果"
    level: 1
    priority: 7
    required_sources: [ad_target_report]
    optional_sources: [ad_campaign_report]
    description: >
      评估每个 target（关键词/ASIN/品类投放）的效果。
      关注 top of search impression share，判断哪些 target 有竞争优势。
    analysis_prompt_hint: >
      对 target_report 的 top 行：
      (1) ROAS (2) ACoS (3) top of search impression share（如果有该字段）。
      impression share 高但 ROAS 低 = 该 target 竞争激烈但回报差，考虑降低出价。
      impression share 低但 ROAS 高 = 该 target 有潜力，考虑提高出价。
    signal_threshold: moderate
    output_artifacts: [target_performance_table]

  time_trend_analysis:
    name: "时间趋势分析"
    level: 1
    priority: 7
    required_sources: [ad_time_trend_report]
    optional_sources: [sales_by_date, ad_by_date]
    description: >
      分析 CPC、花费、点击等指标的时间趋势。
      识别异常波动日、周期性规律、以及趋势拐点。
    analysis_prompt_hint: >
      如果有 time_trend_report 的 summary 数据，关注 CPC 的日间波动。
      如果有 ad_by_date 的日级数据，画出 spend 和 ROAS 的趋势线。
      标注异常日（spend 突增 > 50% 或 ROAS 突降 > 30%）。
    signal_threshold: moderate
    output_artifacts: [trend_chart_data, anomaly_dates]

  invalid_traffic_check:
    name: "无效流量检测"
    level: 1
    priority: 6
    required_sources: [ad_invalid_traffic_report]
    optional_sources: [ad_campaign_report]
    description: >
      检查无效流量（点击欺诈等）的比例。
      如果无效点击占总点击比例 > 5%，标记为高风险。
    analysis_prompt_hint: >
      对 invalid_traffic_report 的 summary：
      (1) 无效点击数 (2) 总点击数（来自其他报表）(3) 无效比例。
      如果 > 5%，建议向 Amazon 申请退款。
    signal_threshold: minimum
    output_artifacts: [invalid_traffic_ratio]

  search_term_share_analysis:
    name: "搜索词展示量份额分析"
    level: 1
    priority: 6
    required_sources: [ad_search_term_share_report]
    optional_sources: [ad_search_term_report]
    description: >
      分析搜索词的展示量份额（impression share）。
      识别展示量份额低但转化好的词（增长机会），
      以及展示量份额高但转化差的词（需要优化）。
    analysis_prompt_hint: >
      对 search_term_share_report：
      (1) impression share 百分比 (2) 结合 search_term_report 的 ROAS。
      高 share + 低 ROAS = 需要降出价或暂停。
      低 share + 高 ROAS = 有机会提高出价获取更多流量。
    signal_threshold: moderate
    output_artifacts: [share_vs_roas_matrix]

  purchased_product_analysis:
    name: "已购买商品分析"
    level: 1
    priority: 7
    required_sources: [ad_purchased_product_report]
    optional_sources: [ad_promoted_product_report]
    description: >
      分析广告点击后实际购买的商品分布。
      识别「点了 A 买了 B」的交叉销售机会，
      以及广告 SKU 和购买 SKU 不一致的情况。
    analysis_prompt_hint: >
      对比 purchased_product_report 和 promoted_product_report：
      如果购买的 SKU ≠ 推广的 SKU，说明广告在为其他 SKU 引流。
      这可能是好事（捆绑销售）也可能是坏事（广告定位不准）。
    signal_threshold: moderate
    output_artifacts: [cross_sell_opportunities]

  # ── Level 2: 交叉分析 ────────────────────────────────────────────────────

  budget_reallocation:
    name: "预算再分配建议"
    level: 2
    priority: 10
    required_sources: [ad_search_term_report, ad_budget_report]
    depends_on: [search_term_waste, budget_utilization]
    description: >
      基于搜索词浪费 + 预算利用率的结论，给出具体的预算调整方案。
      逻辑：把浪费词所在 campaign 的过剩预算，转移到高 ROAS 但预算不足的 campaign。
    analysis_prompt_hint: >
      将 search_term_waste 的结论与 budget_utilization 的结论交叉：
      (1) 找到浪费词所在的 campaign (2) 看该 campaign 的预算是否过剩
      (3) 找到 ROAS 高但预算紧张的 campaign (4) 给出具体的金额转移建议。
      格式：「将 Campaign A 预算从 $X 降至 $Y（释放 $Z），转移至 Campaign B（当前 $M → $N）」。
    signal_threshold: strong
    output_artifacts: [reallocation_plan]

  sku_lifecycle_ad_fit:
    name: "SKU 生命周期 × 广告匹配度"
    level: 2
    priority: 9
    required_sources: [ad_promoted_product_report]
    depends_on: [sku_ad_performance]
    auxiliary_required: [inventory_summary]
    description: >
      检查库存快耗尽的 SKU 是否仍在大量投放广告（浪费），
      以及库存充足但广告投入不足的 SKU（机会）。
    analysis_prompt_hint: >
      交叉 promoted_product_report 和 inventory_summary：
      (1) 缺货 SKU 且 ad spend > 0 → 立即暂停广告，避免浪费
      (2) 库存充足但 ad spend = 0 → 评估是否有广告投放机会
      (3) 库龄 > 180 天且广告仍在投 → 评估是否应该转为清仓模式。
    signal_threshold: moderate
    output_artifacts: [sku_ad_fit_matrix]

  campaign_search_target_optimization:
    name: "Campaign × Search Term × Target 结构优化"
    level: 2
    priority: 9
    required_sources: [ad_campaign_report, ad_search_term_report]
    depends_on: [campaign_health, search_term_waste]
    optional_sources: [ad_target_report]
    description: >
      从 campaign 结构层面分析：哪些 campaign 的搜索词质量差（大量零转化词），
      哪些 campaign 的 target 设置不合理。给出结构调整建议。
    analysis_prompt_hint: >
      将 campaign_health 和 search_term_waste 的结论交叉：
      (1) 亏损 campaign 是否因为搜索词质量差？(2) 高 ROAS campaign 的搜索词有什么特征？
      (3) 是否有 campaign 应该拆分（混合了高转化和低转化词）？
      (4) 如果有 target 数据，检查 target 和 search term 的重叠度。
    signal_threshold: strong
    output_artifacts: [campaign_restructure_plan]

  placement_campaign_efficiency:
    name: "广告位 × Campaign 效率矩阵"
    level: 2
    priority: 7
    required_sources: [ad_placement_report, ad_campaign_report]
    depends_on: [placement_efficiency, campaign_health]
    description: >
      分析不同 campaign 在不同广告位上的表现差异。
      找出「某个 campaign 在 Top of Search 表现好但在 Product Pages 浪费预算」的情况。
    analysis_prompt_hint: >
      如果 placement_report 有 campaign 维度的数据（或可交叉），
      构建 campaign × placement 效率矩阵。
      对 ROAS 差的 campaign-placement 组合建议降低出价或否定投放。
    signal_threshold: moderate
    output_artifacts: [placement_campaign_matrix]

  search_term_budget_campaign_triple:
    name: "搜索词 × 预算 × Campaign 三角优化"
    level: 2
    priority: 10
    required_sources: [ad_search_term_report, ad_budget_report, ad_campaign_report]
    depends_on: [search_term_waste, budget_utilization, campaign_health]
    description: >
      三维交叉分析：搜索词浪费 + 预算利用率 + Campaign 结构健康度。
      找到"浪费词所在的 campaign 预算过剩"且"高 ROAS campaign 预算紧张"的三角矛盾，
      给出精确到金额的预算转移方案。
    analysis_prompt_hint: >
      三维交叉分析步骤：
      (1) 从 search_term_waste 结论中提取浪费词列表及其所在 campaign
      (2) 从 budget_utilization 结论中找到预算过剩和紧张的 campaign
      (3) 从 campaign_health 结论中确认哪些 campaign 值得投入更多预算
      (4) 交叉定位：浪费词所在 campaign 如果预算过剩 → 释放预算
      (5) 高 ROAS 但预算紧张的 campaign → 接收预算
      (6) 输出精确的金额转移计划："Campaign A ($X→$Y) → Campaign B ($M→$N)"
    signal_threshold: strong
    output_artifacts: [triple_optimization_plan]

  inventory_search_term_risk:
    name: "库存 × 搜索词风险联动"
    level: 2
    priority: 8
    required_sources: [ad_search_term_report]
    depends_on: [search_term_waste]
    auxiliary_required: [inventory_summary]
    description: >
      检查缺货 SKU 的搜索词是否仍在消耗广告预算。
      如果某个 SKU 已断货但其搜索词仍有花费，立即暂停。
    analysis_prompt_hint: >
      (1) 从 inventory_summary 找到缺货 SKU 列表
      (2) 从 search_term 数据中找到与这些 SKU 关联的搜索词（通过 campaign 关联 promoted_product_report）
      (3) 如果缺货 SKU 的搜索词仍在花钱 → 紧急告警
      (4) 如果库存紧张（<14天）的 SKU 搜索词花费很高 → 预警
    signal_threshold: moderate
    output_artifacts: [inventory_term_risk_table]

  # ── Level 3: 深度时序交叉 ────────────────────────────────────────────────

  cross_period_search_term_drift:
    name: "搜索词跨周期漂移分析"
    level: 3
    priority: 9
    required_sources: [ad_search_term_report]
    depends_on: [search_term_waste]
    requires_comparison: true
    description: >
      对比本期 vs 上期搜索词表现变化。
      识别正在恶化的词（花费增加但转化下降）、正在改善的词、以及新出现/消失的词。
    analysis_prompt_hint: >
      对比 comparison_period 中的搜索词数据（如果有）：
      (1) 新出现的高花费词 (2) 消失的词（上期有本期没有）
      (3) spend 增加但 orders 下降的词（恶化）(4) spend 不变但 orders 增加的词（改善）。
      注意：comparison_period 的数据粒度可能不够，需要说明数据限制。
    signal_threshold: strong
    output_artifacts: [term_drift_table]

  cross_period_budget_evolution:
    name: "预算效率跨周期演进"
    level: 3
    priority: 8
    required_sources: [ad_budget_report]
    depends_on: [budget_utilization]
    requires_comparison: true
    description: >
      对比本期 vs 上期的预算利用率变化。
      识别预算使用效率在改善还是恶化。
    analysis_prompt_hint: >
      对比 comparison_period 的广告数据：
      (1) 总 spend 变化 (2) 总 ROAS 变化 (3) 预算利用率趋势。
      如果 spend 增加但 ROAS 下降 → 预算效率恶化，需要排查原因。
    signal_threshold: moderate
    output_artifacts: [budget_evolution_chart]

  sku_performance_trajectory:
    name: "SKU 表现轨迹分析"
    level: 3
    priority: 8
    required_sources: [ad_promoted_product_report]
    depends_on: [sku_ad_performance]
    requires_comparison: true
    auxiliary_required: [top_skus, sales_by_date]
    description: >
      分析核心 SKU 的广告 + 自然销量随时间的变化轨迹。
      识别「广告在增长但自然销量在下降」的 SKU（可能过度依赖广告）。
    analysis_prompt_hint: >
      对比 comparison_period 的 top_skus 和广告数据：
      (1) 广告销量增长但自然销量下降 → 警告：过度依赖广告
      (2) 广告和自然同步增长 → 健康增长
      (3) 广告下降但自然增长 → 品牌效应增强。
    signal_threshold: strong
    output_artifacts: [sku_trajectory_chart]

# ═════════════════════════════════════════════════════════════════════════════
# 全局分析策略配置
# ═════════════════════════════════════════════════════════════════════════════
global_strategy:
  roles:
    - name: "亚马逊运营专家"
      focus: "销售、库存、SKU 生命周期、整体运营效率"
    - name: "广告投放优化专家"
      focus: "ROAS、ACoS、搜索词质量、预算分配、出价策略"

  output_rules:
    language: "zh-CN"
    format: "markdown"
    number_precision: 2
    chart_types: [lineChart, pieChart, barChart]
    alert_format: "```alert fenced code block"
    table_format: "standard markdown table"

  decision_chain_template:
    description: >
      每条建议必须包含完整的决策逻辑链：
      发现 → 量化影响 → 建议动作 → 预期效果
    example:
      finding: "搜索词 'waterproof bag large' 花费 $45.20，0 订单"
      impact: "该词占总搜索词花费的 12.3%，直接浪费 $45.20"
      action: "在 Campaign 'SP-Bags' 中对该词设置否定精确匹配"
      expected_outcome: "预计每月节省 $135-180，同时释放预算给高转化词"

