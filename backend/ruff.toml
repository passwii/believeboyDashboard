# 后端 Python linter 配置（ruff）。
#
# 背景：本仓库长期没有项目级 ruff 配置，导致工具链行为不确定：
#
#   1) `ruff --fix` 会删掉 tests/scripts 里那个 load-bearing 的 `# noqa: E402`
#      （tests/scripts/test_cleanup_orphaned_args.py 必须先改 sys.path 再 import），
#      删完立刻触发 E402 —— 因为「E402 是否启用」在不同 runner 下不一致。
#      本项目配置**显式启用 E402**，让该 noqa 成为真正生效的指令，--fix 不会再动它。
#
#   2) 无配置时不同 runner 会落到不同的规则集（pi-lens 内置配置接近 413 条规则 /
#      全仓库 5000+ findings），噪音远大于信号，也容易误伤 FastAPI 惯用写法。
#      这里改为**显式、可解释、可增长**的基线。
#
# 定位：这是**建议性**检查（advisory），不是门禁。后端门禁仍只有 pytest
# （见 AGENTS.md「测试规则」）。`make lint` 会打印按规则的统计，当前约 1.5k 条
# 存量待清理；不要为了让 lint 变绿而改业务代码。
#
# 想扩大覆盖面：往 select 里加家族（如 "B"、"UP"、"RUF"），建议一次加一族并
# 先跑 `make lint --statistics` 评估存量规模。

# 生产 VPS 运行时为 Python 3.13（backend/deploy/systemd + VPS 实测）。
target-version = "py313"
line-length = 88

[lint]
# E4/E7/E9/F = ruff 经典默认（语法错、未定义名、未使用 import 等真问题）
# I          = import 排序
# S          = Bandit 等价安全规则（保留安全信号；高误报子规则见下方 ignore）
select = ["E4", "E7", "E9", "F", "I", "S"]

ignore = [
  "E501",  # 行宽交给 formatter，不在 lint 里逐行卡

  # ── Bandit 高误报子规则（沿用 pi-lens 内置配置的既有 triage 结论）──────────
  "S101",  # assert：pytest/测试代码惯用；仅在安全强制逻辑里才有意义
  "S105",  # hardcoded password：常量名匹配，命中大量非密码字段
  "S106",  # hardcoded password in funcarg
  "S108",  # /tmp 路径：临时文件常规用法
  "S310",  # urllib urlopen：本仓库只访问自有/受信地址
  "S311",  # random：非加密用途（抖动/采样/文件名）
  "S324",  # md5/sha1：非签名用途（缓存 key、指纹）
  "S506",  # yaml.load：仓库内 yaml 均为自有配置文件
  "S603",  # subprocess 无 shell：这是**推荐**的安全写法，规则却会命中
  "S607",  # subprocess 相对路径可执行文件
]

[lint.isort]
# 与仓库实际的顶层包布局对齐，避免 app/、scripts/ 被判成第三方包而错序。
known-first-party = ["app", "scripts"]

[lint.per-file-ignores]
# alembic 迁移是 `alembic revision` 产出的模板样板；重排 import 会给已部署迁移
# 制造无意义 diff，而「已部署到 prod 的迁移禁止改 id / 重命名」是仓库硬约束。
"alembic/versions/*.py" = ["I001"]

# 测试与运维脚本里的 assert / subprocess / 临时路径不属于安全缺陷面。
"tests/**" = ["S"]
"scripts/**" = ["S"]
