name: Deploy dashboard stack

# Manual fallback. The local Mac is the primary release path via
# deploy/deploy-local.sh. Both paths build the same API/Web image pair and call
# the same remote Compose script.

on:
  workflow_dispatch:

concurrency:
  group: believeboy-dashboard-stack
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  API_IMAGE_NAME: ghcr.io/passwii/believeboydashboard-api
  WEB_IMAGE_NAME: ghcr.io/passwii/believeboydashboard-web

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      SSH_HOST: ${{ secrets.VPS_HOST }}
      SSH_USER: root
      DEPLOY_PATH: /opt/believeboy-dashboard
      DOCKER_PLATFORM: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Alembic migration graph
        run: python backend/scripts/check_alembic.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: |
            ${{ env.API_IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha,scope=dashboard-api
          cache-to: type=gha,scope=dashboard-api,mode=max
          provenance: false

      - name: Build and push Web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:sha-${{ github.sha }}
          secrets: |
            nextauth_secret=${{ secrets.NEXTAUTH_SECRET }}
          cache-from: type=gha,scope=dashboard-web
          cache-to: type=gha,scope=dashboard-web,mode=max
          provenance: false

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$SSH_HOST"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/believeboy-dashboard"
          chmod 600 "$HOME/.ssh/believeboy-dashboard"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare runtime
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             if systemctl is-active --quiet believeboy-api.service; then
               echo 'Legacy believeboy-api.service is still active. Run the local cutover first.' >&2
               exit 1
             fi
             test -f '$DEPLOY_PATH/backend.env'
             test -f '$DEPLOY_PATH/web.env'
             test -d '$DEPLOY_PATH/backend-storage'
             sed -i 's#^AI_CHAT_PROVIDER_BASE_URL=.*#AI_CHAT_PROVIDER_BASE_URL=http://127.0.0.1:3100/v1#' '$DEPLOY_PATH/backend.env'
             install -d -m 755 '$DEPLOY_PATH/celerybeat'
             chown -R 10001:10001 '$DEPLOY_PATH/backend-storage' '$DEPLOY_PATH/celerybeat'"

      - name: Sync compose file
        run: |
          scp -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            deploy/docker-compose.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Deploy over SSH
        env:
          API_IMAGE: ${{ env.API_IMAGE_NAME }}@${{ steps.api.outputs.digest }}
          WEB_IMAGE: ${{ env.WEB_IMAGE_NAME }}@${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "API_IMAGE='$API_IMAGE' WEB_IMAGE='$WEB_IMAGE' DEPLOY_PATH='$DEPLOY_PATH' bash -s" \
            < deploy/deploy-remote.sh

      - name: External health check
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 10 https://dash.believeboy.com/healthz >/dev/null; then
              echo "Dashboard healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::https://dash.believeboy.com/healthz is not reachable"
          exit 1
