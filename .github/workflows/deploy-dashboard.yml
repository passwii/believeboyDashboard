name: Deploy dashboard stack

# Manual fallback. The local Mac is the primary release path via
# deploy/deploy-local.sh. Both paths build the FastAPI, Go API, and Web image set
# and call the same remote Compose script.

on:
  workflow_dispatch:

concurrency:
  group: believeboy-dashboard-stack
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  API_IMAGE_NAME: ghcr.io/passwii/believeboydashboard-api
  GO_API_IMAGE_NAME: ghcr.io/passwii/believeboydashboard-go-api
  WEB_IMAGE_NAME: ghcr.io/passwii/believeboydashboard-web

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      SSH_HOST: ${{ secrets.VPS_HOST }}
      SSH_USER: root
      DEPLOY_PATH: /opt/believeboy-dashboard
      DOCKER_PLATFORM: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Alembic migration graph
        run: python backend/scripts/check_alembic.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: |
            ${{ env.API_IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha,scope=dashboard-api
          cache-to: type=gha,scope=dashboard-api,mode=max
          provenance: false

      - name: Build and push Go API
        id: go_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend-go/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: |
            ${{ env.GO_API_IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=dashboard-go-api
          cache-to: type=gha,scope=dashboard-go-api,mode=max
          provenance: false

      - name: Build and push Web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:sha-${{ github.sha }}
          secrets: |
            nextauth_secret=${{ secrets.NEXTAUTH_SECRET }}
          cache-from: type=gha,scope=dashboard-web
          cache-to: type=gha,scope=dashboard-web,mode=max
          provenance: false

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$SSH_HOST"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/believeboy-dashboard"
          chmod 600 "$HOME/.ssh/believeboy-dashboard"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare runtime
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             legacy_repo=/root/believeboyDashboard
             install -d -m 755 '$DEPLOY_PATH' '$DEPLOY_PATH/legacy'
             if [ -f '$DEPLOY_PATH/docker-compose.yml' ] && [ ! -f '$DEPLOY_PATH/legacy/docker-compose.yml' ]; then
               cp '$DEPLOY_PATH/docker-compose.yml' '$DEPLOY_PATH/legacy/docker-compose.yml'
             fi
             if [ -f '$DEPLOY_PATH/app.env' ] && [ ! -f '$DEPLOY_PATH/legacy/app.env' ]; then
               cp '$DEPLOY_PATH/app.env' '$DEPLOY_PATH/legacy/app.env'
             fi
             if [ ! -f '$DEPLOY_PATH/backend.env' ]; then
               test -f \"\$legacy_repo/backend/.env\"
               install -m 600 \"\$legacy_repo/backend/.env\" '$DEPLOY_PATH/backend.env'
             fi
             if [ ! -f '$DEPLOY_PATH/web.env' ]; then
               test -f '$DEPLOY_PATH/app.env'
               install -m 600 '$DEPLOY_PATH/app.env' '$DEPLOY_PATH/web.env'
             fi
             test -f '$DEPLOY_PATH/backend.env'
             test -f '$DEPLOY_PATH/web.env'
             sed -i 's#^AI_CHAT_PROVIDER_BASE_URL=.*#AI_CHAT_PROVIDER_BASE_URL=http://127.0.0.1:3100/v1#' '$DEPLOY_PATH/backend.env'
             cp '$DEPLOY_PATH/web.env' '$DEPLOY_PATH/web.env.next'
             if grep -q '^BACKEND_INTERNAL_URL=' '$DEPLOY_PATH/web.env.next'; then
               sed -i 's#^BACKEND_INTERNAL_URL=.*#BACKEND_INTERNAL_URL=http://127.0.0.1:8200#' '$DEPLOY_PATH/web.env.next'
             else
               printf 'BACKEND_INTERNAL_URL=http://127.0.0.1:8200\n' >> '$DEPLOY_PATH/web.env.next'
             fi
             if ! grep -q '^BACKEND_PUBLIC_API_BASE_URL=' '$DEPLOY_PATH/web.env.next'; then
               public_api=\"\$(sed -n 's/^BACKEND_API_BASE_URL=//p' '$DEPLOY_PATH/web.env.next' | head -1)\"
               test -n \"\$public_api\"
               printf 'BACKEND_PUBLIC_API_BASE_URL=%s\n' \"\$public_api\" >> '$DEPLOY_PATH/web.env.next'
             fi
             install -d -m 755 '$DEPLOY_PATH/backend-storage' '$DEPLOY_PATH/celerybeat'
             if [ -d \"\$legacy_repo/backend/storage\" ] && [ ! -f '$DEPLOY_PATH/.storage-migrated' ]; then
               cp -a \"\$legacy_repo/backend/storage/.\" '$DEPLOY_PATH/backend-storage/'
               touch '$DEPLOY_PATH/.storage-migrated'
             fi
             if [ -d /var/lib/believeboy ] && [ ! -f '$DEPLOY_PATH/.celerybeat-migrated' ]; then
               cp -a /var/lib/believeboy/. '$DEPLOY_PATH/celerybeat/'
               touch '$DEPLOY_PATH/.celerybeat-migrated'
             fi
             chmod 600 '$DEPLOY_PATH/backend.env' '$DEPLOY_PATH/web.env' '$DEPLOY_PATH/web.env.next'
             chown -R 10001:10001 '$DEPLOY_PATH/backend-storage' '$DEPLOY_PATH/celerybeat'"

      - name: Stage Go Gateway environment
        env:
          GO_API_TRUSTED_PROXY_SECRET: ${{ secrets.GO_API_TRUSTED_PROXY_SECRET }}
        run: |
          set -euo pipefail
          if [[ ! "$GO_API_TRUSTED_PROXY_SECRET" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::GO_API_TRUSTED_PROXY_SECRET must be a 64-character hex value."
            exit 1
          fi
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          printf 'GO_API_TRUSTED_PROXY_SECRET=%s\n' "$GO_API_TRUSTED_PROXY_SECRET" > "$secret_file"
          chmod 600 "$secret_file"
          scp -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$secret_file" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/.go-api-secret.next"
          ssh -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             secret_file='$DEPLOY_PATH/.go-api-secret.next'
             chmod 600 \"\$secret_file\"
             sed -i '/^GO_API_TRUSTED_PROXY_SECRET=/d' '$DEPLOY_PATH/web.env.next'
             cat \"\$secret_file\" >> '$DEPLOY_PATH/web.env.next'
             {
               printf 'GO_API_ADDR=127.0.0.1:8200\\n'
               printf 'FASTAPI_ORIGIN=http://127.0.0.1:8100\\n'
               printf 'GO_API_OWNED=health,exchange_rates,notifications,alerts,profile\\n'
               cat \"\$secret_file\"
             } > '$DEPLOY_PATH/go.env.next'
             chmod 600 '$DEPLOY_PATH/web.env.next' '$DEPLOY_PATH/go.env.next'
             rm -f \"\$secret_file\""

      - name: Stop legacy runtime
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             systemctl stop believeboy-beat.service 2>/dev/null || true
             systemctl stop believeboy-celery.service believeboy-celery-scheduled.service 2>/dev/null || true
             systemctl stop believeboy-api.service 2>/dev/null || true
             docker stop believeboy-dashboard 2>/dev/null || true
             docker rm believeboy-dashboard 2>/dev/null || true"

      - name: Sync deployment files
        run: |
          scp -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            deploy/docker-compose.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml.next"
          scp -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            deploy/deploy-remote.sh \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/deploy-remote.sh.next"

      - name: Deploy over SSH
        id: deploy
        env:
          API_IMAGE: ${{ env.API_IMAGE_NAME }}@${{ steps.api.outputs.digest }}
          GO_API_IMAGE: ${{ env.GO_API_IMAGE_NAME }}@${{ steps.go_api.outputs.digest }}
          WEB_IMAGE: ${{ env.WEB_IMAGE_NAME }}@${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "mv '$DEPLOY_PATH/deploy-remote.sh.next' '$DEPLOY_PATH/deploy-remote.sh' && \
               API_IMAGE='$API_IMAGE' GO_API_IMAGE='$GO_API_IMAGE' WEB_IMAGE='$WEB_IMAGE' DEPLOY_PATH='$DEPLOY_PATH' \
              bash '$DEPLOY_PATH/deploy-remote.sh'"

      - name: External health check
        id: health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 10 https://dash.believeboy.com/healthz >/dev/null &&
              curl -fsS --max-time 10 https://dash-api.believeboy.com/api/v1/health/live >/dev/null; then
              echo "Web and API healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Dashboard Web or API health check is not reachable"
          exit 1

      - name: Diagnose deployment failure
        if: ${{ always() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure') }}
        env:
          API_IMAGE: ${{ env.API_IMAGE_NAME }}@${{ steps.api.outputs.digest }}
          GO_API_IMAGE: ${{ env.GO_API_IMAGE_NAME }}@${{ steps.go_api.outputs.digest }}
          WEB_IMAGE: ${{ env.WEB_IMAGE_NAME }}@${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH'
             API_IMAGE='$API_IMAGE' GO_API_IMAGE='$GO_API_IMAGE' WEB_IMAGE='$WEB_IMAGE' docker compose ps || true
             API_IMAGE='$API_IMAGE' GO_API_IMAGE='$GO_API_IMAGE' WEB_IMAGE='$WEB_IMAGE' docker compose logs --tail=200 || true
             systemctl is-active believeboy-api believeboy-celery \
               believeboy-celery-scheduled believeboy-beat 2>/dev/null || true"

      - name: Disable legacy units
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "systemctl disable believeboy-api.service believeboy-celery.service \
              believeboy-celery-scheduled.service believeboy-beat.service \
              >/dev/null 2>&1 || true"
