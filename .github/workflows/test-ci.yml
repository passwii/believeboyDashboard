name: test-ci

# 全局测试套件跑在 CI（不在本地跑）——本地只做单元测试。
#
# 背景（用户 2026-10-22 明确要求）：
#   "本地制作单元测试，全局测试放在 GitHub Action 做，不要再本地做大量的全局测试。
#    避免出现 CPU 负载问题。"
#
# 所以本 workflow 承担**全量**套件（本地不要跑）：
#   - backend: pytest 全量（约 4400 个用例，需要独立测试库）
#   - frontend: vitest 全量（276 文件 / 2136 例，约 90s）
#   - backend-go / desktop: go test + go vet（backend-go 另跑 race）
#   - live contract: 同一测试库上对 FastAPI 与 Go 做 14 条 GET 的
#     status + JSON 语义对账；缺依赖或任何差异都失败
# 本地开发请只跑**目标文件**（见 TESTING.md 的 T1/T2 分流表）。
#
# 触发时机：push 到 main + 面向 main 的 PR。

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "backend-go/**"
      - "desktop/**"
      - "productEnvAgent/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/test-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "backend-go/**"
      - "desktop/**"
      - "productEnvAgent/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/test-ci.yml"
  workflow_dispatch: {}
  schedule:
    # Nightly at 18:00 UTC (02:00 Asia/Shanghai): full fallback for path filters.
    - cron: "0 18 * * *"

permissions:
  contents: read
  pull-requests: read

# 同一时刻只跑一条（排队而非取消）：全局套件动辄几分钟，
# 并发跑多份会互相抢 CPU，反而更慢。
concurrency:
  group: test-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_go: ${{ steps.filter.outputs.backend_go }}
      desktop: ${{ steps.filter.outputs.desktop }}
      frontend: ${{ steps.frontend_filter.outputs.frontend }}
      deploy_config: ${{ steps.deploy_config_filter.outputs.deploy_config }}
      live_contract: ${{ steps.filter.outputs.live_contract }}
      go_parity: ${{ steps.filter.outputs.go_parity }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - "productEnvAgent/**"
              - ".github/workflows/test-ci.yml"
            backend_go:
              - "backend-go/**"
              - ".github/workflows/test-ci.yml"
            desktop:
              - "desktop/**"
              - ".github/workflows/test-ci.yml"
            live_contract:
              - "backend/**"
              - "backend-go/**"
              - ".github/workflows/test-ci.yml"
            go_parity:
              - "backend-go/**"
              - "frontend/types/api-generated/openapi.json"
              - "deploy/validate-local-go-cutover.sh"
              - ".github/workflows/test-ci.yml"
            deploy:
              - "deploy/**"
              - ".github/workflows/test-ci.yml"
      - uses: dorny/paths-filter@v3
        id: frontend_filter
        with:
          # every：代码文件需同时命中“frontend/**”和两个否定规则；
          # 文档路径会被排除，避免 frontend/docs/** 误触发全量 Vitest。
          predicate-quantifier: every
          filters: |
            frontend:
              - "frontend/**"
              - "!frontend/docs/**"
              - "!frontend/**/*.md"
      - uses: dorny/paths-filter@v3
        id: deploy_config_filter
        with:
          # 部署配置不变量测试放在 frontend/scripts（pnpm test 入口），
          # 但断言的是 deploy/** 与部署 workflow。只按 frontend/** 过滤会漏跑：
          # 改 compose / 部署脚本时这些断言从未执行，main 绿灯因此失真（BLF-1489）。
          filters: |
            deploy_config:
              - "deploy/**"
              - ".github/workflows/deploy-dashboard.yml"
              - ".github/workflows/test-ci.yml"

  backend-go:
    name: backend-go test + vet
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend_go == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: go test
        run: go test ./... -count=1

      - name: go vet
        run: go vet ./...

      # 2026-11-10 production incident: the Go gateway image was alpine without
      # tzdata, so store.OpenPool's AfterConnect time.LoadLocation failed for
      # "Asia/Shanghai" and every DB-backed Go route returned 500 while
      # /health/live stayed green. CI runs on ubuntu (system tzdata), so unit
      # tests cannot catch it — assert the dependency is embedded instead.
      - name: tzdata embedded in Go binaries
        run: |
          set -euo pipefail
          missing=0
          for pkg in ./cmd/gateway ./cmd/worker; do
            if ! go list -deps "$pkg" | grep -qx 'time/tzdata'; then
              echo "::error::$pkg does not embed time/tzdata; the alpine runtime image would fail every database connection at timezone lookup."
              missing=1
            fi
          done
          exit "$missing"

      - name: go test -race
        run: go test -race ./... -count=1

  desktop:
    name: desktop test + vet
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.desktop == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: go test
        run: go test ./... -count=1

      - name: go vet
        run: go vet ./...

  backend:
    name: backend pytest (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: agent-api
            pytest_args: "tests/api/agent"
          - shard: crm
            pytest_args: "tests/api/crm tests/services/crm"
          - shard: api-core
            pytest_args: "tests/api --ignore=tests/api/agent --ignore=tests/api/crm"
          - shard: services-tooling
            pytest_args: "tests --ignore=tests/api --ignore=tests/services/crm"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: blf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d blf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 测试库独立于任何开发 / 生产库；URL 指向 CI 里的 postgres service。
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/blf_ci
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/blf_ci
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      API_KEY: ci-api-key-placeholder
      TEST_ADMIN_PASSWORD: ci-admin-password-placeholder
      TEST_OPERATOR_PASSWORD: ci-operator-password-placeholder
      TEST_BUSINESSDEV_PASSWORD: ci-businessdev-password-placeholder
      # 部分 services 测试在 import 期硬要求 PROD_DATABASE_URL（见 backend/tests/README.md
      # 的已知问题），CI 里给一个**不可连**的占位值，只为越过 import 期校验。
      PROD_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/does_not_exist
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 建测试库 schema（Goose 迁移）
        working-directory: backend-go
        run: go run ./cmd/migrate up

      - name: 灌测试参考数据
        working-directory: backend-go
        run: go run ./cmd/seedtestreference

      - name: 灌测试账号
        working-directory: backend-go
        run: go run ./cmd/seedtestaccounts

      - name: pytest 全量（基线对账门禁）
        # 门禁语义：基线内的既有失败不阻断；**基线之外的新失败 = 回归 = 阻断**。
        # 详见 backend/scripts/ci_pytest_gate.py 与 backend/tests/ci_known_failures.txt。
        run: python scripts/ci_pytest_gate.py -- ${{ matrix.pytest_args }}

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report-${{ matrix.shard }}
          path: backend/.pytest_cache/
          if-no-files-found: ignore
          retention-days: 7

  live-contract:
    name: live contract (FastAPI ↔ Go)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.live_contract == 'true'
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: blf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d blf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/blf_ci
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/blf_ci
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      AI_CHAT_REDIS_DB: 3
      INSIGHT_STREAM_REDIS_DB: 4
      APP_ENV: ci
      ENABLE_SCHEDULER: "false"
      FRONTEND_URL: http://localhost:3000
      API_KEY: ci-live-contract-key
      TEST_ADMIN_PASSWORD: "ci-admin-password"
      TEST_OPERATOR_PASSWORD: "ci-operator-password"
      TEST_BUSINESSDEV_PASSWORD: "ci-businessdev-password"
      FASTAPI_ORIGIN: http://127.0.0.1:18100
      GO_API_TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/blf_ci
      LIVE_CONTRACT_API_KEY: ci-live-contract-key
      LIVE_CONTRACT_REQUIRED: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: 安装 FastAPI 依赖
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 建独立测试库 schema
        working-directory: backend-go
        run: go run ./cmd/migrate up

      - name: 灌参考数据
        working-directory: backend-go
        run: go run ./cmd/seedtestreference

      - name: 灌测试账号
        working-directory: backend-go
        run: go run ./cmd/seedtestaccounts

      - name: 灌 live contract 固定数据
        working-directory: backend-go
        run: go run ./cmd/seedlivecontract --database-url "$GO_API_TEST_DATABASE_URL"

      - name: 启动 FastAPI
        working-directory: backend
        run: |
          set -euo pipefail
          nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 18100 \
            --no-access-log \
            >"$RUNNER_TEMP/fastapi.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/fastapi.pid"
          for _ in $(seq 1 60); do
            if curl -fsS "$FASTAPI_ORIGIN/api/v1/health/live" >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/fastapi.pid")" 2>/dev/null; then
              echo "FastAPI exited during startup" >&2
              cat "$RUNNER_TEMP/fastapi.log" >&2
              exit 1
            fi
            sleep 1
          done
          echo "FastAPI did not become ready at $FASTAPI_ORIGIN" >&2
          cat "$RUNNER_TEMP/fastapi.log" >&2
          exit 1

      - name: FastAPI ↔ Go live contract
        working-directory: backend-go
        run: go test ./tests/contract -run TestWeek1LiveContractFastAPIAgainstGo -count=1 -v

      - name: FastAPI 日志（失败时）
        if: failure()
        run: cat "$RUNNER_TEMP/fastapi.log"

      - name: 停止 FastAPI
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/fastapi.pid" ]]; then
            pid="$(cat "$RUNNER_TEMP/fastapi.pid")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
            fi
          fi

  go-parity:
    name: go-only route parity (no FastAPI)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go_parity == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: blf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d blf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      API_KEY: ci-go-parity-key
      GO_API_TRUSTED_PROXY_SECRET: ci-go-parity-proxy-secret
      GO_API_OWNED: all
      GO_API_ADDR: 127.0.0.1:18200
      FASTAPI_ORIGIN: http://127.0.0.1:18100
      DATABASE_URL: postgresql://ci:ci@localhost:5432/blf_ci
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: ci
      # 网关默认根目录是仓库相对路径，这里改成绝对路径（步骤工作目录是 backend-go）
      UPLOAD_ROOT: ${{ github.workspace }}/go-parity-uploads
      MONTHLY_REPORT_RESULT_ROOT: ${{ github.workspace }}/go-parity-uploads/results
      AGENT_MONTHLY_REPORT_ROOT: ${{ github.workspace }}/go-parity-uploads/agent-monthly-reports
      PROJECT_LAUNCH_DOCUMENTS_ROOT: ${{ github.workspace }}/backend/app/resources/project_launch_documents
      TEST_ADMIN_PASSWORD: "ci-admin-password"
      TEST_OPERATOR_PASSWORD: "ci-operator-password"
      TEST_BUSINESSDEV_PASSWORD: "ci-businessdev-password"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: 建测试库 schema
        working-directory: backend-go
        run: go run ./cmd/migrate up

      - name: 灌参考数据与测试账号
        working-directory: backend-go
        run: |
          go run ./cmd/seedtestreference
          go run ./cmd/seedtestaccounts

      - name: 构建 Go 网关
        working-directory: backend-go
        run: go build -o "$RUNNER_TEMP/go-gateway" ./cmd/gateway

      - name: 启动 Go 网关（all 模块，无 FastAPI）
        working-directory: backend-go
        run: |
          set -euo pipefail
          nohup "$RUNNER_TEMP/go-gateway" >"$RUNNER_TEMP/go-gateway.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/go-gateway.pid"
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:18200/api/v1/health/ready" >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/go-gateway.pid")" 2>/dev/null; then
              echo "Go gateway exited during startup" >&2
              cat "$RUNNER_TEMP/go-gateway.log" >&2
              exit 1
            fi
            sleep 1
          done
          echo "Go gateway did not become ready" >&2
          cat "$RUNNER_TEMP/go-gateway.log" >&2
          exit 1

      - name: Go-only 全量 GET 路由对账
        working-directory: backend-go
        run: |
          go run ./cmd/routeparity \
            --go-only \
            --go http://127.0.0.1:18200 \
            --openapi frontend/types/api-generated/openapi.json \
            --admin-header true \
            --user-id 1 \
            --api-key "$API_KEY" \
            --proxy-secret "$GO_API_TRUSTED_PROXY_SECRET"

      - name: 网关日志（失败时）
        if: failure()
        run: tail -200 "$RUNNER_TEMP/go-gateway.log" || true

      - name: 停止 Go 网关
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/go-gateway.pid" ]]; then
            pid="$(cat "$RUNNER_TEMP/go-gateway.pid")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
            fi
          fi
  deploy-scripts:
    name: deploy scripts (shellcheck + compose config)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.deploy == 'true' ||
      needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck 部署脚本
        run: shellcheck -S error deploy/*.sh productEnvAgent/*.sh

      - name: 校验 Compose 默认栈（纯 Go）
        working-directory: deploy
        env:
          GO_API_IMAGE: example/go-api
          API_IMAGE: example/api
          WEB_IMAGE: example/web
        run: |
          set -euo pipefail
          services="$(docker compose -f docker-compose.yml config --services | sort | tr '\n' ' ')"
          echo "default services: $services"
          for required in migrate go-api go-worker go-scheduler web; do
            case " $services " in
              *" $required "*) ;;
              *) echo "::error::default stack is missing $required" >&2; exit 1 ;;
            esac
          done
          for forbidden in api celery celery-scheduled beat; do
            case " $services " in
              *" $forbidden "*) echo "::error::$forbidden must stay behind the legacy-python profile" >&2; exit 1 ;;
              *) ;;
            esac
          done

      - name: 校验 legacy-python profile 完整
        working-directory: deploy
        env:
          GO_API_IMAGE: example/go-api
          API_IMAGE: example/api
          WEB_IMAGE: example/web
        run: |
          set -euo pipefail
          services="$(docker compose -f docker-compose.yml --profile legacy-python config --services | sort | tr '\n' ' ')"
          echo "legacy services: $services"
          for required in api celery celery-scheduled beat; do
            case " $services " in
              *" $required "*) ;;
              *) echo "::error::legacy-python profile is missing $required" >&2; exit 1 ;;
            esac
          done

  frontend:
    name: frontend vitest (全量)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.deploy_config == 'true'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Mock 稳定性检查（BLF-1247）
        run: pnpm check:mocks

      - name: Lint
        run: pnpm lint

      - name: vitest 全量
        # BLF-1238：全量 vitest 曾在某些文件上不收敛，已修；这里放 CI 跑，
        # 本地请按 TESTING.md 只跑目标文件，避免 CPU 负载。
        run: pnpm test
