name: Clean legacy dashboard artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.VPS_HOST }}
      SSH_USER: root
      DEPLOY_PATH: /opt/believeboy-dashboard

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/believeboy-dashboard"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/believeboy-dashboard" "$HOME/.ssh/known_hosts"

      - name: Verify healthy before cleanup
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://dash.believeboy.com/healthz
          curl -fsS --max-time 15 https://dash-api.believeboy.com/api/v1/health/live
          ssh -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             test -f '$DEPLOY_PATH/backend.env'
             test -f '$DEPLOY_PATH/web.env'
             test -d '$DEPLOY_PATH/backend-storage'
             test -d '$DEPLOY_PATH/celerybeat'
             for service in api web celery celery-scheduled beat; do
               container_status=\"\$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \"believeboy-dashboard-\$service\")\"
               test \"\$container_status\" = healthy
             done"

      - name: Measure and remove legacy checkout
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             legacy_repo=/root/believeboyDashboard
             if [ -d \"\$legacy_repo\" ]; then
               test ! -L \"\$legacy_repo\"
               test \"\$(realpath \"\$legacy_repo\")\" = /root/believeboyDashboard
               test -f '$DEPLOY_PATH/.storage-migrated'
               if [ -d \"\$legacy_repo/backend/storage\" ]; then
                 source_bytes=\"\$(du -sb \"\$legacy_repo/backend/storage\" | awk '{print \$1}')\"
                 target_bytes=\"\$(du -sb '$DEPLOY_PATH/backend-storage' | awk '{print \$1}')\"
                 source_files=\"\$(find \"\$legacy_repo/backend/storage\" -type f | wc -l | tr -d ' ')\"
                 target_files=\"\$(find '$DEPLOY_PATH/backend-storage' -type f | wc -l | tr -d ' ')\"
                 echo \"Legacy storage: bytes=\$source_bytes files=\$source_files\"
                 echo \"Runtime storage: bytes=\$target_bytes files=\$target_files\"
                 if ! diff -qr \"\$legacy_repo/backend/storage\" '$DEPLOY_PATH/backend-storage' > /tmp/dashboard-storage-diff.txt; then
                   sed -n '1,40p' /tmp/dashboard-storage-diff.txt
                   echo 'Storage differs; refusing to delete the legacy checkout.' >&2
                   exit 1
                 fi
                 rm -f /tmp/dashboard-storage-diff.txt
               fi
               echo 'Legacy checkout size before deletion:'
               du -sh \"\$legacy_repo\"
               du -s -B1 \"\$legacy_repo\"
               echo 'Disk before:'
               df -h / | tail -1
               rm -rf -- \"\$legacy_repo\"
               test ! -e \"\$legacy_repo\"
               echo 'Disk after:'
               df -h / | tail -1
             else
               echo 'Legacy checkout is already absent.'
             fi
             for service in believeboy-api believeboy-celery believeboy-celery-scheduled believeboy-beat; do
               if systemctl is-active --quiet \"\$service\"; then
                 echo \"Refusing cleanup: \$service is active\" >&2
                 exit 1
               fi
               systemctl disable \"\$service\" >/dev/null 2>&1 || true
             done"

      - name: Verify after cleanup
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://dash.believeboy.com/healthz
          curl -fsS --max-time 15 https://dash-api.believeboy.com/api/v1/health/live
          ssh -i "$HOME/.ssh/believeboy-dashboard" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail
             test ! -e /root/believeboyDashboard
             for service in api web celery celery-scheduled beat; do
               container_status=\"\$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \"believeboy-dashboard-\$service\")\"
               echo \"\$service: \$container_status\"
               test \"\$container_status\" = healthy
             done"
