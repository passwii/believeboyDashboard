name: motion-system-ci

# Playwright regression suite for the frontend motion system.
# Scoped to the motion-system branch + PRs targeting it; does NOT
# duplicate the project-wide Lighthouse CI in lighthouse-ci.yml.

on:
  push:
    branches: [feat/frontend-motion-system]
  pull_request:
    branches: [feat/frontend-motion-system, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: playwright (chromium + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # Production server (pnpm start) 需要 NEXTAUTH_SECRET，否则 middleware 抛 500
      # 用 CI mock secret — 仅用于 build/Playwright smoke，不影响生产
      NEXTAUTH_SECRET: ci-mock-secret-not-secure-do-not-use-in-production-abcdef0123456789
      NEXTAUTH_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API types (type-check sanity)
        run: pnpm gen:api-types:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Vitest (unit)
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright (motion-system specs)
        run: pnpm exec playwright test --grep "@motion|motion system|reduced-motion|reduced-transparency|motion-budget"
