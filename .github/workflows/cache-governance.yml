name: cache-governance

# 缓存治理 CI（BLF-666）：
# step 1 — check_cache_decorator_coverage.py（白名单腐烂 hard fail / 未登记 soft warn）
# step 2 — A 类 + B 类不变量测试
# 任一步失败即阻断 PR 合入。

on:
  pull_request:
    paths:
      - "backend/app/services/infra/**"
      - "backend/tests/services/infra/**"
      - "backend/scripts/check_cache_decorator_coverage.py"
      - ".github/workflows/cache-governance.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/services/infra/**"
      - "backend/tests/services/infra/**"
      - "backend/scripts/check_cache_decorator_coverage.py"
      - ".github/workflows/cache-governance.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cache-governance:
    name: cache governance invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache write-endpoint coverage guard
        # 白名单腐烂 → exit 1（阻断）；未登记写端点 → warning（exit 0）
        run: python scripts/check_cache_decorator_coverage.py

      - name: Invariant tests (A + B)
        env:
          # 纯单元测试，不连数据库；占位 URL 仅为满足 Settings 校验
          TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci_placeholder
        run: python -m pytest tests/services/infra/test_cache_decorator.py tests/services/infra/test_cache_decorator_invariants.py -v
