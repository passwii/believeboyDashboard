# XcodeGen project spec for BelieveBoyMac.
#
# Usage:
#   brew install xcodegen
#   cd macos
#   xcodegen generate           # produces BelieveBoyMac.xcodeproj
#   open BelieveBoyMac.xcodeproj
#
# We do NOT commit BelieveBoyMac.xcodeproj — it is regenerated from this
# file. The .gitignore rule for xcodeproj lives at the repo root.
#
# Bundle ID, deployment target, capabilities: keep aligned with BEL-147
# scope doc (macOS native client, macOS 14+, reuses existing FastAPI).

name: BelieveBoyMac

options:
  bundleIdPrefix: com.passwii.believeboy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""           # fill in when signing for distribution
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ONLY_ACTIVE_ARCH: NO

targets:
  BelieveBoyMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: BelieveBoyMac
        excludes:
          - "Resources/Info.plist"
          - "Resources/BelieveBoyMac.entitlements"
    resources:
      - path: BelieveBoyMac/Resources/Assets.xcassets
    info:
      path: BelieveBoyMac/Resources/Info.plist
      properties:
        CFBundleDisplayName: BelieveBoy Mac
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Passwii. All rights reserved."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        NSApplicationCategoryType: public.app-category.business
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
    entitlements:
      path: BelieveBoyMac/Resources/BelieveBoyMac.entitlements
      properties:
        com.apple.security.app-sandbox: false   # see BEL-147 — sandbox off for v1 (Excel/PDF I/O)
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passwii.believeboy.macos
        PRODUCT_NAME: BelieveBoyMac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: BelieveBoyMac/Resources/BelieveBoyMac.entitlements
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  BelieveBoyMac:
    build:
      targets:
        BelieveBoyMac: all
    run:
      config: Debug
      askForAppToLaunch: false
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release