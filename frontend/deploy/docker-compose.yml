services:
  web:
    image: ghcr.io/passwii/believeboydashboard:${IMAGE_TAG:-latest}
    container_name: believeboy-dashboard
    restart: unless-stopped
    env_file:
      - ./app.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3200"
    ports:
      - "127.0.0.1:${APP_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3200/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
