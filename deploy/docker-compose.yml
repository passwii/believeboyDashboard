name: believeboy-dashboard

# PostgreSQL, Redis and Caddy stay on the host. Host networking preserves the
# current host contract: the Go gateway reaches loopback-only PostgreSQL and
# Redis; Caddy uses 127.0.0.1:3200 for Web and 127.0.0.1:8200 for the gateway.
# There is no FastAPI or Celery service: the Python runtime is retired.

# Shared log rotation for every service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrate:
    image: "${GO_API_IMAGE:?GO_API_IMAGE must be set}"
    network_mode: host
    env_file:
      - ./backend.env
    entrypoint: ["/usr/local/bin/go-migrate"]
    command: ["up"]
    restart: "no"
    init: true

  go-api:
    image: "${GO_API_IMAGE:?GO_API_IMAGE must be set}"
    container_name: believeboy-dashboard-go-api
    network_mode: host
    env_file:
      - ./backend.env
      - ./go.env
    # Only the migration must finish first; FastAPI is optional now (the gateway
    # owns every route it implements and proxies the rest).
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    mem_limit: 256m
    healthcheck:
      # Readiness (DB-aware), not liveness: a gateway that cannot reach the
      # database must surface as unhealthy instead of silently serving 500s.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/api/v1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    logging: *logging

  go-worker:
    image: "${GO_API_IMAGE:?GO_API_IMAGE must be set}"
    container_name: believeboy-dashboard-go-worker
    network_mode: host
    env_file:
      - ./backend.env
      - ./go.env
    entrypoint: ["/usr/local/bin/go-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    mem_limit: 512m
    logging: *logging

  go-scheduler:
    image: "${GO_API_IMAGE:?GO_API_IMAGE must be set}"
    container_name: believeboy-dashboard-go-scheduler
    network_mode: host
    env_file:
      - ./backend.env
      - ./go.env
    entrypoint: ["/usr/local/bin/go-scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    mem_limit: 256m
    logging: *logging

  web:
    image: "${WEB_IMAGE:?WEB_IMAGE must be set}"
    container_name: believeboy-dashboard-web
    network_mode: host
    env_file:
      - ./web.env
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: "3200"
    depends_on:
      go-api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3200/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging: *logging
