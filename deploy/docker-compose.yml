name: believeboy-dashboard

# PostgreSQL, Redis and Caddy stay on the host. Host networking preserves the
# current systemd contract: containers can reach loopback-only PostgreSQL and
# Redis, while Caddy keeps using 127.0.0.1:3200 and 127.0.0.1:8100.
services:
  migrate:
    image: "${API_IMAGE:?API_IMAGE must be set}"
    network_mode: host
    env_file:
      - ./backend.env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    init: true

  api:
    image: "${API_IMAGE:?API_IMAGE must be set}"
    container_name: believeboy-dashboard-api
    network_mode: host
    env_file:
      - ./backend.env
    command:
      - uvicorn
      - app.main:app
      - --host
      - 127.0.0.1
      - --port
      - "8100"
      - --no-access-log
      - --workers
      - "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    mem_limit: 1g
    volumes:
      - ./backend-storage:/app/backend/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request as u;
          u.urlopen('http://127.0.0.1:8100/api/v1/health/live', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery:
    image: "${API_IMAGE:?API_IMAGE must be set}"
    container_name: believeboy-dashboard-celery
    network_mode: host
    env_file:
      - ./backend.env
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - -l
      - info
      - -Q
      - default,reports,insights,ai_summary
      - --concurrency=1
      - --max-tasks-per-child=50
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    mem_limit: 512m
    mem_reservation: 384m
    memswap_limit: 640m
    volumes:
      - ./backend-storage:/app/backend/storage
    logging: *logging

  celery-scheduled:
    image: "${API_IMAGE:?API_IMAGE must be set}"
    container_name: believeboy-dashboard-celery-scheduled
    network_mode: host
    env_file:
      - ./backend.env
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - -Q
      - scheduled
      - -c
      - "2"
      - --loglevel=info
      - --max-tasks-per-child=50
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    mem_limit: 768m
    mem_reservation: 640m
    memswap_limit: 1g
    shm_size: 512m
    volumes:
      - ./backend-storage:/app/backend/storage
    logging: *logging

  beat:
    image: "${API_IMAGE:?API_IMAGE must be set}"
    container_name: believeboy-dashboard-beat
    network_mode: host
    env_file:
      - ./backend.env
    command:
      - celery
      - -A
      - app.tasks.celery_beat_app
      - beat
      - -l
      - info
      - --schedule=/var/lib/believeboy/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 256m
    volumes:
      - ./celerybeat:/var/lib/believeboy
    logging: *logging

  web:
    image: "${WEB_IMAGE:?WEB_IMAGE must be set}"
    container_name: believeboy-dashboard-web
    network_mode: host
    env_file:
      - ./web.env
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: "3200"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3200/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging: *logging
