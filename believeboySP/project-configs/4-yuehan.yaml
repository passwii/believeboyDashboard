# 玥涵 PROJECT (id=4) — 广告分析主配置
# 最后更新: 2026-07-02（用户确认 schema 后落盘）
# 配套文件:
#   - 4-yuehan-taxonomy.yaml（词性分类词典 + 互补品候选）
#   - ../docs/ad-analysis-framework.md（框架 v2.2）

project:
  id: 4
  name: 玥涵
  stage: growth                  # 枚举: new | growth | mature | declining
  primary_country: US
  category: drill_bits           # 用于跨项目对比的品类标签
  peer_project_ids: []           # 用户手动指定的对照项目（如 [7, 15]）

# ── 4 档阈值（项目级 baseline） ──
# 双锚定原则：与项目内分位数（自动校准）+ 行业基准（兜底）联合使用
# 详见 docs/ad-analysis-framework.md §3
thresholds:
  acos:
    excellent: 15.0              # ≤ 优秀
    good: 25.0                   # ≤ 良好
    fair: 40.0                   # ≤ 一般；> fair 即不及格
  roas:
    excellent: 6.67              # ≥ (100/acos_good)；高产出
    good: 4.0
    fair: 2.5                    # < fair 即不及格
  ctr:                            # 百分比
    excellent: 1.0
    good: 0.5
    fair: 0.3
  cvr:                            # 百分比
    excellent: 15.0
    good: 10.0
    fair: 5.0
  invalid_impression_rate:
    excellent: 5.0
    good: 10.0
    fair: 20.0

# ── 行业参考线（兜底） ──
# 当项目样本不足时使用
industry_baseline:
  acos_avg_sp: 30.0              # Amazon SP 平均 ACOS
  ctr_avg_sp: 0.4                # 0.3-0.5%
  cvr_avg_sp: 10.0               # 10-15%
  roas_avg_sp: 3.0
  cpc_avg_sp: 1.0                # 品类相关，drill_bits 中等

# ── 样本过滤规则 ──
# 详见 docs/ad-analysis-framework.md §3.4 + §6
# 长尾词不做点击量过滤（避免过滤掉有潜力长尾词），但加置信度标签
sampling:
  head_term:                      # 品类大词（曝光 > 1000）
    min_impressions: 100
    min_clicks: 10
    confidence: high
  long_tail:                      # 长尾词（曝光 ≤ 1000）
    min_impressions: 0
    min_clicks: 0
    confidence: low

# ── 置信度标签（与 §3.3 一致） ──
confidence_labels:
  star_high:                      # ★high
    min_impressions: 100
    min_orders: 3
  star_medium:                    # ☆medium
    min_impressions: 20
    min_orders: 1

# ── 时间窗口策略 ──
# 详见 docs/ad-analysis-framework.md §2
time_windows:
  default: 30d
  trend: 90d
  burst_compare: 14d             # D5 爆发词对比窗口
  comparison_periods: 4          # 连续 4 周期对比（T / T-1 / T-2 / T-3）

# ── D 系列强信号筛选参数 ──
# D1 / D4 主题 D 实战用的阈值
d_signals:
  d1:                             # 高 ROAS × 低曝光词
    min_roas: 3.0
    max_imp_share: 30.0          # impression_share < 30%
  d4:                             # 提价机会（TopShare）
    min_roas: 3.0
    max_top_share: 5.0           # 成熟店更严（v2.2 反哺 5）
  d5_burst:                       # 爆发词定义（v2.2 §9.6）
    p1_impr_ratio: 1.5            # P1: recent_impr > prev_impr × 1.5
    p3_sales_ratio: 2.0           # P3: recent_sales > prev_sales × 2

# ── API 基础 URL（默认走生产 API） ──
api:
  base_url: https://dash-api.believeboy.com
  path_prefix: /api/v1/external
  cache_dir: /tmp/ad-analysis     # 缓存目录

# ── 输出格式 ──
output:
  top_n_strong: 25                # 强信号 Top N
  top_n_repr: 3                   # 代表词 Top N（每类）
  include_raw_data: false         # 默认不输出 raw 行